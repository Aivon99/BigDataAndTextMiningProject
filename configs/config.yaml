# Settings used by Datasets_creator.ipynb to build the datasets.

dataset_generation:
  csv_path: "lichess_db_puzzle.csv"
  random_seed: 42

  # Rows sampled from the Lichess CSV before balancing.
  max_samples: 20000

  # Puzzles kept for each side to move (total = n_per_turn * 2).
  n_per_turn: 2000

  image_size: 512
